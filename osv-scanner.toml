reason = "Astro 6.4.8 XSS via unescaped spread attribute names in renderHTMLElement. Fix requires Astro 7.0.6 (major upgrade of the live site). Unreachable: no spread attributes on elements in any .astro file."
# review-by: 2026-08-21 — re-check; remove once the Astro 6->7 upgrade WI lands.

