# osv-scanner suppression list.
#
# The previous yaml dev-dependency finding (GHSA-48c2-rrv3-qjmp — yaml 2.7.1
# stack overflow, pulled transitively by yaml-language-server) is now resolved
# by pinning yaml to 2.8.3 via the `overrides` block in site/package.json, so
# no ignore is required.
#
# Add an [[IgnoredVulns]] entry below only for a finding that genuinely cannot
# be remediated. Each entry MUST carry a reason and a review date so a
# suppression can't silently outlive its upstream fix — re-check on/after the
# date and delete the entry once a fixed version is available. Template:
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   reason = "why this can't be fixed yet (package, version, blocker)"
#   # review-by: YYYY-MM-DD — re-check upstream for a fix and remove if available.

# --- Astro 6.4.8 XSS advisories, published 2026-07-20 ---
#
# These three are a DELIBERATE, TIME-BOXED EXCEPTION to the rule above: a fix
# does exist, but every one of them requires Astro 6 -> 7, a major-version
# upgrade of the framework behind the live public site. Taking that unplanned,
# mid-sprint, is a worse risk than a dated deferral.
#
# All three were verified UNREACHABLE in our source at the time of suppression:
#   - no `transition:` directives anywhere in site/src
#   - no `astro:transitions` / ClientRouter import
#   - no spread attributes on elements in any .astro file
# The site cannot exercise any of the three vulnerable code paths.
#
# The Astro 6->7 upgrade is a tracked Work Item. If it has not landed by the
# review date, do not silently extend these — re-verify reachability and
# escalate.

[[IgnoredVulns]]
id = "GHSA-4g3v-8h47-v7g6"
reason = "Astro 6.4.8 reflected XSS via unescaped View Transition animation properties. Fix requires Astro 7.1.0 (major upgrade of the live site). Unreachable: site uses no view transitions and imports no ClientRouter."
# review-by: 2026-08-21 — re-check; remove once the Astro 6->7 upgrade WI lands.

