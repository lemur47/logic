# osv-scanner suppression list.
#
# The previous yaml dev-dependency finding (GHSA-48c2-rrv3-qjmp — yaml 2.7.1
# stack overflow, pulled transitively by yaml-language-server) is now resolved
# by pinning yaml to 2.8.3 via the `overrides` block in site/package.json, so
# no ignore is required.
#
# Add an [[IgnoredVulns]] entry below only for a finding that genuinely cannot
# be remediated. Each entry MUST carry a reason and a review date so a
# suppression can't silently outlive its upstream fix — re-check on/after the
# date and delete the entry once a fixed version is available. Template:
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   reason = "why this can't be fixed yet (package, version, blocker)"
#   # review-by: YYYY-MM-DD — re-check upstream for a fix and remove if available.

# --- Currently empty ---
#
# The three Astro 6.4.8 XSS advisories (GHSA-4g3v-8h47-v7g6,
# GHSA-f48w-9m4c-m7f5, GHSA-7pw4-f3q4-r2p2) were suppressed here as a
# time-boxed exception because every fix required Astro 6 -> 7. That upgrade
# has landed, so the suppressions are removed rather than expired — osv-scanner
# reported all three as unused ignores once Astro 7 was in the lockfile, which
# is the signal that a deferral has been discharged by real work.
