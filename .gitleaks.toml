# Gitleaks Configuration for logic repo
# Compatible with gitleaks v8.30.0+
# Detects Anthropic API keys and other common secrets

title = "logic repo gitleaks config"

[extend]
useDefault = true

# Custom rule for Anthropic API keys (sk-ant- pattern)
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[a-zA-Z0-9\-_]{20,}'''
keywords = ["sk-ant-"]
tags = ["api", "anthropic", "key"]

# Cloudflare API tokens (starts with letters, 40 chars)
[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API Token"
regex = '''[a-zA-Z0-9_]{37,40}'''
keywords = ["CF_API_TOKEN", "CLOUDFLARE_API_TOKEN"]
tags = ["api", "cloudflare"]

# Generic high-entropy secrets in Python files
[[rules]]
id = "python-secret-assignment"
description = "Hardcoded secret in Python"
regex = '''(?i)(api_key|secret|token|password)\s*=\s*["\'][a-zA-Z0-9\-_]{16,}["\']'''
path = '''\.py$'''
tags = ["python", "secret"]

# Airtable identifiers (base/table/field/record/view/select). These are the
# internal CTO<->CC channel — they belong in Airtable itself, the KV, and the
# gitignored CLAUDE-internal.md, never in tracked git artefacts (commits, code,
# docs). Prefix + exactly 14 base62 chars + word boundary keeps it off ordinary
# words; the entropy floor filters out pronounceable 17-char camelCase
# identifiers (e.g. applicationConfig) that would otherwise collide.
[[rules]]
id = "airtable-id"
description = "Airtable identifier (base/table/field/record/view/select id)"
regex = '''\b((?:app|tbl|fld|rec|viw|sel)[A-Za-z0-9]{14})\b'''
entropy = 3.5
secretGroup = 1
tags = ["airtable", "internal-id"]

# Allowlist for false positives.
#
# Deliberately NARROW: markdown, docs and test files are NOT path-exempt — a
# real key pasted into a blog post, doc, or test fixture must still be caught.
# Sanctioned examples are handled by the placeholder `regexes` below, not by
# exempting whole file types. Only this config and build noise are path-exempt.
[allowlist]
description = "Global allowlist"
paths = [
    '''^\.gitleaks\.toml$''',
    '''__pycache__''',
]

# Allow example/placeholder patterns — the only sanctioned "secrets" in-repo.
regexes = [
    '''sk-ant-your-key-here''',
    '''sk-ant-\.\.\.''',
    '''your_.*_here''',
    '''REPLACE_WITH_.*''',
    '''<YOUR_.*>''',
    # Airtable-ID placeholders in the CTO-brief template (recXXXXXXXXXXXXXX etc.)
    '''(?:app|tbl|fld|rec|viw|sel)X{14}''',
]
