# logic repo - pyproject.toml
# R&D and prototyping tools

[project]
name = "pmorun-mcp"
version = "0.1.0"
description = "pmo.run MCP server — classic PMO decision tools (PERT, Monte Carlo, TCO, EVM) over the Model Context Protocol."
readme = "mcp_server/README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "lemur47" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "pmo",
    "pert",
    "monte-carlo",
    "tco",
    "evm",
    "project-management",
]

dependencies = [
    "fastapi[standard]>=0.128.0",
    "mcp[cli]>=1.0",
    "numpy>=2.2.0",
    "pydantic>=2.0",
    "scipy>=1.15.0",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]

[project.scripts]
pmorun-mcp = "mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
    "httpx>=0.28.1",  # For FastAPI testing
    "pyright>=1.1.408",
]
analysis = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[tool.setuptools.packages.find]
include = ["app*", "mcp_server*"]

# ═══════════════════════════════════════════════════════════════════════════════
# Ruff Configuration
# ═══════════════════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FAST",  # fastapi
    "I",     # isort
    "N",     # pep8-naming
    "W",     # pycodestyle warnings
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # FastAPI Depends() in function args
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ═══════════════════════════════════════════════════════════════════════════════
# Pytest Configuration
# ═══════════════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]
asyncio_mode = "auto"

# ═══════════════════════════════════════════════════════════════════════════════
# Pyright Configuration
# ═══════════════════════════════════════════════════════════════════════════════
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"  # Start lenient, move to "strict" later
include = ["app"]
exclude = ["tests", ".venv", "__pycache__", "examples"]
reportMissingImports = true
reportMissingTypeStubs = false  # Avoid noise from untyped libraries
