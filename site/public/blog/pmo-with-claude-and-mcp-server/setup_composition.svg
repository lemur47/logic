<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Question in (top) -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="200" y="20" width="280" height="44" rx="8" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1px" stroke-dasharray="5 4"/>
  <text x="340" y="38" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:13px;font-weight:500">&#8220;What date can we commit to</text>
  <text x="340" y="54" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:13px;font-weight:500">at the steering committee?&#8221;</text>

  <line x1="340" y1="64" x2="340" y2="108" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

  <!-- Claude (centre) -->
  <rect x="250" y="110" width="180" height="64" rx="8" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123);stroke-width:0.5px"/>
  <text x="340" y="134" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:15px;font-weight:600">Claude</text>
  <text x="340" y="154" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:12px">reasons, asks, explains</text>

  <!-- Data MCP (left) -->
  <rect x="30" y="110" width="160" height="64" rx="8" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165);stroke-width:0.5px"/>
  <text x="110" y="134" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:14px;font-weight:500">Your data MCP</text>
  <text x="110" y="154" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:12px">Airtable, Jira, sheets&#8230;</text>

  <!-- pmorun-mcp (right) -->
  <rect x="490" y="110" width="160" height="64" rx="8" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236);stroke-width:0.5px"/>
  <text x="570" y="134" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);font-size:14px;font-weight:500">pmorun-mcp</text>
  <text x="570" y="154" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:12px">PERT &#183; MC &#183; TCO &#183; EVM</text>

  <!-- Bidirectional links -->
  <line x1="192" y1="142" x2="248" y2="142" marker-end="url(#arrow)" marker-start="url(#arrow)" style="fill:none;stroke:rgb(93, 202, 165);stroke-width:1.5px"/>
  <text x="220" y="128" text-anchor="middle" style="fill:rgb(93, 202, 165);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:11px">ground truth</text>
  <line x1="432" y1="142" x2="488" y2="142" marker-end="url(#arrow)" marker-start="url(#arrow)" style="fill:none;stroke:rgb(175, 169, 236);stroke-width:1.5px"/>
  <text x="460" y="128" text-anchor="middle" style="fill:rgb(175, 169, 236);font-family:&quot;Anthropic Sans&quot;, -apple-system, sans-serif;font-size:11px">the method</text>

  <line x1="340" y1="174" x2="340" y2="218" marker-end="url(#arrow)" style="fill:none;stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

  <!-- Grounded number out (bottom) -->
  <rect x="170" y="220" width="340" height="56" rx="8" style="fill:none;stroke:rgb(93, 202, 165);stroke-width:1px"/>
  <text x="340" y="240" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:13px;font-weight:600">&#8220;P85 is week 17.4 &#8212; here is the run,</text>
  <text x="340" y="258" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:13px;font-weight:600">the seed, and the two tasks driving it.&#8221;</text>

  <text x="30" y="306" style="fill:rgb(156, 154, 146);font-size:11px">Same question, same data, same method &#8212; anyone on the team gets the same number.</text>
