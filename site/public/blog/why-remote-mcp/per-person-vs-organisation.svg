<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Individual AI use versus shared intelligence between humans and AI</title>
  <desc id="desc">Left: three team members each bring context and prompt packs to their own general AI assistant and receive generated answers. Right: the same assistants all call one endpoint holding the organisation's decision logic, so everyone gets the same calculated, auditable answer.</desc>
  <style>
    text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a1d24; }
    .divider { stroke: #1a1d24; stroke-width: 1; opacity: 0.30; stroke-dasharray: 4 4; }
    .box { fill: none; stroke: #1a1d24; stroke-width: 1.25; opacity: 0.55; rx: 6; }
    .shared { fill: none; stroke: #085041; stroke-width: 2; }
    .flowL { stroke: #c8442a; stroke-width: 1.75; fill: none; stroke-dasharray: 5 4; }
    .flowR { stroke: #085041; stroke-width: 1.75; fill: none; }
    .heading { font-size: 14px; font-weight: 600; }
    .boxtext { font-size: 12.5px; }
    .sharedtext { font-size: 12.5px; font-weight: 600; fill: #085041; }
    .caption { font-size: 12.5px; opacity: 0.65; }
  </style>

  <defs>
    <marker id="arwL" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c8442a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#085041" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line class="divider" x1="340" y1="58" x2="340" y2="330"/>

  <!-- Headings -->
  <text class="heading" x="170" y="40" text-anchor="middle">Individual AI use</text>
  <text class="heading" x="510" y="40" text-anchor="middle">Shared intelligence</text>

  <!-- Left: three person/AI pairs -->
  <rect class="box" x="36" y="84" width="106" height="34" rx="6"/>
  <text class="boxtext" x="89" y="105" text-anchor="middle">Team member</text>
  <rect class="box" x="200" y="84" width="104" height="34" rx="6"/>
  <text class="boxtext" x="252" y="105" text-anchor="middle">General AI</text>
  <line class="flowL" x1="148" y1="101" x2="194" y2="101" marker-start="url(#arwL)" marker-end="url(#arwL)"/>

  <rect class="box" x="36" y="152" width="106" height="34" rx="6"/>
  <text class="boxtext" x="89" y="173" text-anchor="middle">Team member</text>
  <rect class="box" x="200" y="152" width="104" height="34" rx="6"/>
  <text class="boxtext" x="252" y="173" text-anchor="middle">General AI</text>
  <line class="flowL" x1="148" y1="169" x2="194" y2="169" marker-start="url(#arwL)" marker-end="url(#arwL)"/>

  <rect class="box" x="36" y="220" width="106" height="34" rx="6"/>
  <text class="boxtext" x="89" y="241" text-anchor="middle">Team member</text>
  <rect class="box" x="200" y="220" width="104" height="34" rx="6"/>
  <text class="boxtext" x="252" y="241" text-anchor="middle">General AI</text>
  <line class="flowL" x1="148" y1="237" x2="194" y2="237" marker-start="url(#arwL)" marker-end="url(#arwL)"/>

  <text class="caption" x="170" y="300" text-anchor="middle">Context and prompt packs copied per person;</text>
  <text class="caption" x="170" y="318" text-anchor="middle">numbers generated, not calculated</text>

  <!-- Right: three assistants converging on one endpoint -->
  <rect class="box" x="376" y="84" width="104" height="34" rx="6"/>
  <text class="boxtext" x="428" y="105" text-anchor="middle">AI assistant</text>
  <rect class="box" x="376" y="152" width="104" height="34" rx="6"/>
  <text class="boxtext" x="428" y="173" text-anchor="middle">AI assistant</text>
  <rect class="box" x="376" y="220" width="104" height="34" rx="6"/>
  <text class="boxtext" x="428" y="241" text-anchor="middle">AI assistant</text>

  <rect class="shared" x="536" y="132" width="116" height="74" rx="8"/>
  <text class="sharedtext" x="594" y="162" text-anchor="middle">Your decision</text>
  <text class="sharedtext" x="594" y="180" text-anchor="middle">logic, one URL</text>

  <path class="flowR" d="M486 101 C 510 101, 512 148, 530 154" marker-end="url(#arwR)"/>
  <line class="flowR" x1="486" y1="169" x2="530" y2="169" marker-end="url(#arwR)"/>
  <path class="flowR" d="M486 237 C 510 237, 512 190, 530 184" marker-end="url(#arwR)"/>

  <text class="caption" x="510" y="300" text-anchor="middle">One governed source for everyone;</text>
  <text class="caption" x="510" y="318" text-anchor="middle">answers calculated and auditable</text>
</svg>
