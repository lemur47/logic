<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">

<!-- Axis baseline -->
<line x1="40" y1="370" x2="640" y2="370" stroke="rgba(222, 220, 209, 0.35)" stroke-width="0.75"/>

<!-- Step 1: Foundation (bottom-left) -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="40" y="290" width="140" height="64" rx="8" style="fill:rgb(68, 68, 65);stroke:rgb(180, 178, 169);stroke-width:0.5px"/>
  <text x="110" y="312" text-anchor="middle" dominant-baseline="central" style="fill:rgb(211, 209, 199);font-size:14px;font-weight:500">Foundation</text>
  <text x="110" y="332" text-anchor="middle" dominant-baseline="central" style="fill:rgb(180, 178, 169);font-size:12px;font-weight:400">Single-point estimate</text>
  <!-- Visualisation: one dot -->
  <line x1="60" y1="240" x2="160" y2="240" stroke="rgba(222, 220, 209, 0.4)" stroke-width="0.5"/>
  <circle cx="110" cy="240" r="5" style="fill:rgb(211, 209, 199);stroke:rgb(180, 178, 169);stroke-width:1"/>
  <text x="110" y="222" text-anchor="middle" style="fill:rgba(222, 220, 209, 0.8);font-size:10px">one number</text>
</g>

<!-- Step 2: Intermediate -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="200" y="230" width="140" height="64" rx="8" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165);stroke-width:0.5px"/>
  <text x="270" y="252" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:14px;font-weight:500">Intermediate</text>
  <text x="270" y="272" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:12px;font-weight:400">Three-point PERT</text>
  <!-- Visualisation: three ticks O-M-P with expected value marker -->
  <line x1="220" y1="190" x2="320" y2="190" stroke="rgba(159, 225, 203, 0.45)" stroke-width="0.5"/>
  <line x1="230" y1="184" x2="230" y2="196" stroke="rgb(159, 225, 203)" stroke-width="1.5"/>
  <line x1="270" y1="178" x2="270" y2="202" stroke="rgb(159, 225, 203)" stroke-width="2"/>
  <line x1="310" y1="184" x2="310" y2="196" stroke="rgb(159, 225, 203)" stroke-width="1.5"/>
  <text x="230" y="214" text-anchor="middle" style="fill:rgba(159, 225, 203, 0.85);font-size:10px">O</text>
  <text x="270" y="214" text-anchor="middle" style="fill:rgba(159, 225, 203, 0.85);font-size:10px">M</text>
  <text x="310" y="214" text-anchor="middle" style="fill:rgba(159, 225, 203, 0.85);font-size:10px">P</text>
  <text x="270" y="170" text-anchor="middle" style="fill:rgba(159, 225, 203, 0.8);font-size:10px">a range</text>
</g>

<!-- Step 3: Advanced -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="360" y="170" width="140" height="64" rx="8" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236);stroke-width:0.5px"/>
  <text x="430" y="192" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);font-size:14px;font-weight:500">Advanced</text>
  <text x="430" y="212" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:12px;font-weight:400">Calibrated PERT</text>
  <!-- Visualisation: three ticks with confidence band -->
  <rect x="388" y="125" width="84" height="14" style="fill:rgba(175, 169, 236, 0.18);stroke:none"/>
  <line x1="380" y1="132" x2="480" y2="132" stroke="rgba(175, 169, 236, 0.45)" stroke-width="0.5"/>
  <line x1="390" y1="126" x2="390" y2="138" stroke="rgb(175, 169, 236)" stroke-width="1.5"/>
  <line x1="430" y1="120" x2="430" y2="144" stroke="rgb(175, 169, 236)" stroke-width="2"/>
  <line x1="470" y1="126" x2="470" y2="138" stroke="rgb(175, 169, 236)" stroke-width="1.5"/>
  <text x="430" y="112" text-anchor="middle" style="fill:rgba(175, 169, 236, 0.8);font-size:10px">a calibrated range</text>
  <text x="430" y="158" text-anchor="middle" style="fill:rgba(175, 169, 236, 0.7);font-size:9px">with field coefficients</text>
</g>

<!-- Step 4: Expert -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="520" y="110" width="140" height="64" rx="8" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123);stroke-width:0.5px"/>
  <text x="590" y="132" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:14px;font-weight:500">Expert</text>
  <text x="590" y="152" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:12px;font-weight:400">Probabilistic distribution</text>
  <!-- Visualisation: skewed distribution curve -->
  <path d="M 540 80 Q 555 80, 565 75 Q 575 65, 585 55 Q 595 50, 605 55 Q 615 65, 625 75 Q 635 82, 640 80 L 640 90 L 540 90 Z" style="fill:rgba(240, 153, 123, 0.22);stroke:rgb(240, 153, 123);stroke-width:1"/>
  <text x="590" y="44" text-anchor="middle" style="fill:rgba(240, 153, 123, 0.85);font-size:10px">full distribution</text>
  <text x="590" y="102" text-anchor="middle" style="fill:rgba(240, 153, 123, 0.7);font-size:9px">Monte Carlo on PERT</text>
</g>

<!-- Y-axis label (implicit: sophistication ↑) -->
<text x="20" y="360" transform="rotate(-90 20 360)" style="fill:rgba(222, 220, 209, 0.65);font-size:11px;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">Estimation sophistication →</text>

<!-- Bottom caption -->
<text x="340" y="395" text-anchor="middle" style="fill:rgba(222, 220, 209, 0.65);font-size:11px;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">House of PMO Competency levels → estimation artefact</text>
<text x="340" y="410" text-anchor="middle" style="fill:rgba(222, 220, 209, 0.5);font-size:10px;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">Each level is deployable — not aspirational.</text>

</svg>
