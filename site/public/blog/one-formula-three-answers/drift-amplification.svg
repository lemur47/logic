<svg width="100%" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- The loop -->
<path d="M440 59 Q 550 59 550 155" fill="none" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
<path d="M550 223 Q 550 319 445 319" fill="none" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
<path d="M260 319 Q 150 319 150 223" fill="none" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
<path d="M150 155 Q 150 59 255 59" fill="none" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="260" y="30" width="180" height="58" rx="8" style="fill:rgb(38, 38, 36);stroke:rgb(156, 154, 146);stroke-width:0.5px"/>
  <text x="350" y="52" text-anchor="middle" dominant-baseline="central" style="fill:rgb(232, 230, 227);font-size:14px;font-weight:500">Estimate</text>
  <text x="350" y="72" text-anchor="middle" dominant-baseline="central" style="fill:rgb(156, 154, 146);font-size:11px;font-weight:400">rounded to two places</text>

  <rect x="460" y="160" width="180" height="58" rx="8" style="fill:rgb(38, 38, 36);stroke:rgb(156, 154, 146);stroke-width:0.5px"/>
  <text x="550" y="182" text-anchor="middle" dominant-baseline="central" style="fill:rgb(232, 230, 227);font-size:14px;font-weight:500">Decision</text>
  <text x="550" y="202" text-anchor="middle" dominant-baseline="central" style="fill:rgb(156, 154, 146);font-size:11px;font-weight:400">budget, schedule, provision</text>

  <rect x="260" y="290" width="180" height="58" rx="8" style="fill:rgb(38, 38, 36);stroke:rgb(156, 154, 146);stroke-width:0.5px"/>
  <text x="350" y="312" text-anchor="middle" dominant-baseline="central" style="fill:rgb(232, 230, 227);font-size:14px;font-weight:500">Actual</text>
  <text x="350" y="332" text-anchor="middle" dominant-baseline="central" style="fill:rgb(156, 154, 146);font-size:11px;font-weight:400">what the work really took</text>

  <rect x="60" y="160" width="180" height="58" rx="8" style="fill:rgb(38, 38, 36);stroke:rgb(156, 154, 146);stroke-width:0.5px"/>
  <text x="150" y="182" text-anchor="middle" dominant-baseline="central" style="fill:rgb(232, 230, 227);font-size:14px;font-weight:500">Calibration</text>
  <text x="150" y="202" text-anchor="middle" dominant-baseline="central" style="fill:rgb(156, 154, 146);font-size:11px;font-weight:400">adjusts the next estimate</text>
</g>

<!-- The drift riding the loop -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="262" y="150" width="176" height="78" rx="8" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123);stroke-width:0.5px"/>
  <text x="350" y="174" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:22px;font-weight:500">8.7%</text>
  <text x="350" y="199" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:11px;font-weight:400">rides the loop and is</text>
  <text x="350" y="214" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:11px;font-weight:400">re-learnt as if it were data</text>
</g>

<path d="M350 348 L350 392" fill="none" marker-end="url(#arrow)" style="stroke:rgb(240, 153, 123);stroke-width:1.5px"/>

<!-- Where it surfaces -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="60" y="394" width="580" height="86" rx="8" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123);stroke-width:0.5px"/>
  <text x="350" y="418" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:14px;font-weight:500">Portfolio roll-up · contingency · the interval reported to the board</text>
  <text x="350" y="443" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:12px;font-weight:400">present in some reporting periods, absent in others</text>
  <text x="350" y="464" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:12px;font-weight:500">so it reads as volatile delivery, not as a faulty instrument</text>
</g>
</svg>
