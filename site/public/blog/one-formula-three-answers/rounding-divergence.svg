<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- One input, one formula -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="170" y="20" width="340" height="64" rx="8" style="fill:rgb(38, 38, 36);stroke:rgb(156, 154, 146);stroke-width:0.5px"/>
  <text x="340" y="43" text-anchor="middle" dominant-baseline="central" style="fill:rgb(232, 230, 227);font-size:14px;font-weight:500">One formula, one input</text>
  <text x="340" y="65" text-anchor="middle" dominant-baseline="central" style="fill:rgb(156, 154, 146);font-size:12px;font-weight:400">PERT(0.05, 0.1, 0.3) = 0.125 exactly — a rounding tie</text>
</g>

<path d="M340 84 L340 104 L120 104 L120 128" fill="none" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
<path d="M340 84 L340 128" fill="none" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
<path d="M340 84 L340 104 L560 104 L560 128" fill="none" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

<!-- Three implementations -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="20" y="130" width="200" height="118" rx="8" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165);stroke-width:0.5px"/>
  <text x="120" y="154" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:13px;font-weight:500">Tracker formula field</text>
  <text x="120" y="176" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px;font-weight:400">rounds half up</text>
  <text x="120" y="205" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:22px;font-weight:500">0.13</text>
  <text x="120" y="232" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:11px;font-weight:400">THE RECORD</text>
</g>

<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="240" y="130" width="200" height="118" rx="8" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123);stroke-width:0.5px"/>
  <text x="340" y="154" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:13px;font-weight:500">Python core</text>
  <text x="340" y="176" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:11px;font-weight:400">rounds half to even</text>
  <text x="340" y="205" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:22px;font-weight:500">0.12</text>
  <text x="340" y="232" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:11px;font-weight:400">derived view</text>
</g>

<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="460" y="130" width="200" height="118" rx="8" style="fill:rgb(38, 38, 36);stroke:rgb(156, 154, 146);stroke-width:0.5px"/>
  <text x="560" y="154" text-anchor="middle" dominant-baseline="central" style="fill:rgb(232, 230, 227);font-size:13px;font-weight:500">TypeScript port</text>
  <text x="560" y="176" text-anchor="middle" dominant-baseline="central" style="fill:rgb(156, 154, 146);font-size:11px;font-weight:400">scales, then rounds half up</text>
  <text x="560" y="205" text-anchor="middle" dominant-baseline="central" style="fill:rgb(232, 230, 227);font-size:22px;font-weight:500">0.13</text>
  <text x="560" y="232" text-anchor="middle" dominant-baseline="central" style="fill:rgb(156, 154, 146);font-size:11px;font-weight:400">right answer, wrong route</text>
</g>

<path d="M120 248 L120 274 L340 274 L340 298" fill="none" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
<path d="M340 248 L340 298" fill="none" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

<!-- The consequence -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="110" y="300" width="460" height="106" rx="8" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123);stroke-width:0.5px"/>
  <text x="340" y="324" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:14px;font-weight:500">The same item&apos;s calibration ratio</text>
  <text x="215" y="356" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:22px;font-weight:500">1.15</text>
  <text x="340" y="356" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:14px;font-weight:400">or</text>
  <text x="465" y="356" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:22px;font-weight:500">1.25</text>
  <text x="340" y="387" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:12px;font-weight:400">8.7% apart, from rounding mode alone</text>
</g>
</svg>
