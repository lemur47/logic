<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Two different realities that produce one identical output -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="40" y="26" width="250" height="58" rx="8" style="fill:rgb(8, 80, 65);stroke:rgb(93, 202, 165);stroke-width:0.5px"/>
  <text x="165" y="47" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159, 225, 203);font-size:14px;font-weight:500">Ran, and found nothing</text>
  <text x="165" y="66" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93, 202, 165);font-size:12px;font-weight:400">Genuinely clear</text>
</g>

<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="390" y="26" width="250" height="58" rx="8" style="fill:rgb(113, 43, 19);stroke:rgb(240, 153, 123);stroke-width:0.5px"/>
  <text x="515" y="47" text-anchor="middle" dominant-baseline="central" style="fill:rgb(245, 196, 179);font-size:14px;font-weight:500">Never ran, or looked elsewhere</text>
  <text x="515" y="66" text-anchor="middle" dominant-baseline="central" style="fill:rgb(240, 153, 123);font-size:12px;font-weight:400">Inert, or watching the wrong target</text>
</g>

<path d="M165 84 L165 110 L340 110 L340 132" fill="none" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
<path d="M515 84 L515 110 L340 110" fill="none" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>

<!-- The single ambiguous output -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="180" y="134" width="320" height="58" rx="8" style="fill:rgb(38, 38, 36);stroke:rgb(156, 154, 146);stroke-width:0.5px"/>
  <text x="340" y="155" text-anchor="middle" dominant-baseline="central" style="fill:rgb(232, 230, 227);font-size:14px;font-weight:500">One output: &quot;nothing found&quot;</text>
  <text x="340" y="174" text-anchor="middle" dominant-baseline="central" style="fill:rgb(156, 154, 146);font-size:12px;font-weight:400">Indistinguishable on the dashboard</text>
</g>

<line x1="340" y1="192" x2="340" y2="228" marker-end="url(#arrow)" style="stroke:rgb(156, 154, 146);stroke-width:1.5px"/>
<text x="340" y="212" text-anchor="middle" dominant-baseline="central" style="fill:rgb(156, 154, 146);font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400">Four questions that tell them apart</text>

<!-- The four verification points -->
<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="22" y="240" width="150" height="118" rx="8" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236);stroke-width:0.5px"/>
  <text x="97" y="264" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:18px;font-weight:500">1</text>
  <text x="97" y="292" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);font-size:13px;font-weight:500">Evidence it ran</text>
  <text x="97" y="316" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:11px;font-weight:400">Not evidence it is</text>
  <text x="97" y="332" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:11px;font-weight:400">configured</text>
</g>

<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="184" y="240" width="150" height="118" rx="8" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236);stroke-width:0.5px"/>
  <text x="259" y="264" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:18px;font-weight:500">2</text>
  <text x="259" y="292" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);font-size:13px;font-weight:500">Absence is not</text>
  <text x="259" y="308" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);font-size:13px;font-weight:500">clean</text>
  <text x="259" y="332" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:11px;font-weight:400">Empty reads unknown</text>
</g>

<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="346" y="240" width="150" height="118" rx="8" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236);stroke-width:0.5px"/>
  <text x="421" y="264" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:18px;font-weight:500">3</text>
  <text x="421" y="292" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);font-size:13px;font-weight:500">Field of view</text>
  <text x="421" y="316" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:11px;font-weight:400">Can it see the</text>
  <text x="421" y="332" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:11px;font-weight:400">failure at all?</text>
</g>

<g style="font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <rect x="508" y="240" width="150" height="118" rx="8" style="fill:rgb(60, 52, 137);stroke:rgb(175, 169, 236);stroke-width:0.5px"/>
  <text x="583" y="264" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:18px;font-weight:500">4</text>
  <text x="583" y="292" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206, 203, 246);font-size:13px;font-weight:500">Still alive</text>
  <text x="583" y="316" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:11px;font-weight:400">After repeated</text>
  <text x="583" y="332" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175, 169, 236);font-size:11px;font-weight:400">change</text>
</g>
</svg>
