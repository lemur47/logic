<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1060" width="900" height="1060">
  <defs>
    <!-- Subtle radial glow for center -->
    <radialGradient id="coreGlow" cx="50%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Arrow marker -->
