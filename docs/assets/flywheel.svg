  <text x="450.0" y="78" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">The pmo.run philosophy: every deliverable creates value for the world</text>

  <!-- Top accent line -->
  <line x1="390.0" y1="94" x2="510.0" y2="94" stroke="#f97316" stroke-width="2" opacity="0.8"/>


