  <circle cx="100.0" cy="792" r="3.5" fill="#f97316" opacity="0.8"/>
  <text x="112.0" y="796" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#94a3b8">Every experiment becomes a public deliverable</text>


  <circle cx="470.0" cy="792" r="3.5" fill="#22c55e" opacity="0.8"/>
  <text x="482.0" y="796" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#94a3b8">Math is auditable — our logic is always open source</text>


  <circle cx="100.0" cy="822" r="3.5" fill="#3b82f6" opacity="0.8"/>
  <text x="112.0" y="826" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#94a3b8">Composable modules anyone can import or self-host</text>


  <circle cx="470.0" cy="822" r="3.5" fill="#a855f7" opacity="0.8"/>
  <text x="482.0" y="826" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#94a3b8">Bilingual content (EN/JA) for global + local impact</text>


  <circle cx="100.0" cy="852" r="3.5" fill="#06b6d4" opacity="0.8"/>
  <text x="112.0" y="856" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#94a3b8">Community trust through radical transparency</text>


  <circle cx="470.0" cy="852" r="3.5" fill="#ec4899" opacity="0.8"/>
  <text x="482.0" y="856" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#94a3b8">We build for contribution first, revenue follows naturally</text>


