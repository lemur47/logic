  <circle cx="450.0" cy="420" r="195" fill="none" stroke="#2a2d3a" stroke-width="0.5" opacity="0.3"/>
  <circle cx="450.0" cy="420" r="120" fill="#141720" stroke="#2a2d3a" stroke-width="0.5" opacity="0.8"/>

  <path d="M 512.7 226.9 A 203 203 0 0 1 585.8 269.1" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.35" marker-end="url(#arrowHead)"/>
  <path d="M 648.6 377.8 A 203 203 0 0 1 648.6 462.2" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.35" marker-end="url(#arrowHead)"/>
  <path d="M 585.8 570.9 A 203 203 0 0 1 512.7 613.1" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.35" marker-end="url(#arrowHead)"/>
  <path d="M 387.3 613.1 A 203 203 0 0 1 314.2 570.9" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.35" marker-end="url(#arrowHead)"/>
  <path d="M 251.4 462.2 A 203 203 0 0 1 251.4 377.8" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.35" marker-end="url(#arrowHead)"/>
  <path d="M 314.2 269.1 A 203 203 0 0 1 387.3 226.9" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.35" marker-end="url(#arrowHead)"/>

