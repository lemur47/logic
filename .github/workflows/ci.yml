# GitHub Actions CI Workflow
# Runs on push to main, all PRs, and weekly Monday scan
#
# Jobs: gitleaks scan, opengrep SAST, osv-scanner SCA, ruff lint, pyright typecheck,
#       pytest suite, frontend checks, remote-mcp PoC checks
#
# THIS FILE IS THE MERGE GATE. The "Protect main" ruleset requires nine status
# contexts, and they are keyed on JOB NAMES, not on this file's name or on the
# workflow name. Eight of the nine are the job ids below; the ninth, `CodeQL`,
# is GitHub default setup and is defined in NO FILE in this repository — look
# for it in the web UI, not here.
#
# Renaming this file is therefore safe (it was `security.yml` until 2026-08-14,
# which meant the workflow named "CI" lived somewhere nobody would grep for).
# Renaming, splitting or reorganising the JOBS is NOT: drop a job id the ruleset
# still requires and the context never reports, which leaves main protected by a
# check that can no longer run. Change a job id only together with the ruleset,
# and re-verify from the API afterwards rather than inferring from a green PR:
#
#     gh api /repos/lemur47/logic/rulesets
#
# A PR going green proves the jobs ran. It does not prove they are still required.
#
# Third-party actions are pinned to a full commit SHA (human-readable version in
# a trailing comment) so a moved or hijacked tag can't swap an action out from
# under us. Dependabot (github-actions ecosystem) keeps the SHAs fresh.

name: CI

# Least-privilege GITHUB_TOKEN: every job only reads the repo. Without this
# block the token gets the default write scopes, so a compromised step (hijacked
# action, malicious dependency) could push commits or post as the bot. Trade-off
# accepted: gitleaks-action can no longer comment on PRs — findings fail CI,
# which is the gate that matters.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC
  # Manual re-run — re-verify the full-history scan on demand (e.g. after a
  # .gitleaksignore update) instead of waiting a week for the next cron.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret detection with gitleaks
  gitleaks:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Without this the action installs its own hard-coded default (8.24.3
          # as of v3.0.0) while pre-commit ran 8.30.0 — two surfaces enforcing
          # one rule set with nothing forcing them to agree, which is how the
          # three drifted ruff pins happened. Keep in step with the gitleaks
          # `rev` in .pre-commit-config.yaml. No `v` prefix.
          GITLEAKS_VERSION: "8.30.0"

  # Static analysis with Opengrep (replaces bandit)
  opengrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Direct release-asset download, pinned by version AND binary SHA-256 —
      # no installer script. The upstream install.sh resolves versions through
      # an unauthenticated api.github.com call (rate-limited per shared runner
      # IP → random CI failures) and, called without a version argument,
      # installs LATEST — so the old OPENGREP_VERSION pin only chose the
      # installer, not the binary. Release assets come from GitHub's CDN (no
      # API rate limit), and the checksum now covers the binary itself. Keep
      # OPENGREP_VERSION in step with the local install so CI == local. On
      # bump, regenerate the checksum:
      #   curl -fsSL "https://github.com/opengrep/opengrep/releases/download/<tag>/opengrep_manylinux_x86" | sha256sum
      - name: Install Opengrep
        env:
          OPENGREP_VERSION: v1.25.0
          OPENGREP_BIN_SHA256: 9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33
        run: |
          install_dir="$HOME/.opengrep/bin"
          mkdir -p "$install_dir"
          curl -fsSL -o "$install_dir/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_BIN_SHA256}  $install_dir/opengrep" | sha256sum -c -
          chmod +x "$install_dir/opengrep"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/opengrep" --version

      # Blocking: --error makes opengrep exit non-zero on findings, and we no
      # longer swallow that with `|| true`. A real finding now fails CI.
      - name: Run Opengrep
        run: opengrep scan --config auto --config .opengrep/ --scan-unknown-extensions --error --json -o opengrep-report.json

      - name: Upload Opengrep Report
        if: always() # capture the report even when the scan step fails
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opengrep-report
          path: opengrep-report.json
          if-no-files-found: ignore

  # Dependency vulnerability scanning with osv-scanner
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            --config=osv-scanner.toml
            .

  # Code quality with ruff
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the Python pinned in .python-version and caches by uv.lock hash
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

  # Type checking with pyright
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # --frozen fails the job if uv.lock has drifted from pyproject.toml,
      # so the committed lock is exercised on every run, not just stored.
      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      - name: Run Pyright
        run: uv run pyright

  # Canonical test suite — the merge gate. Until now pytest ran only as a local
  # pre-commit hook, so any push whose hook did not fire could merge a red suite.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      # Runs testpaths = ["tests"] from pyproject.toml. Deliberately BEFORE the
      # analysis extra is installed: `.[dev]` is the documented full-dev install,
      # so the canonical suite must pass without pandas/matplotlib. Installing
      # them first would let a test silently acquire an analysis-only import and
      # still go green here while failing for everyone following the docs.
      - name: Run tests
        run: uv run pytest

      # The standalone examples are outside testpaths, so the step above skips
      # them. They are covered rather than left implicit: the parity-net work
      # ships security tests into exactly this directory, and an untested
      # example is an example that rots. They need the analysis extra for the
      # optional pandas/matplotlib visualisation paths.
      - name: Install analysis extra for the standalone examples
        run: uv sync --frozen --extra dev --extra analysis

      - name: Run standalone example tests
        run: uv run pytest examples/standalone/

  # Frontend checks (Astro + Svelte + TypeScript)
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      # Parity net: the site's calculators against fixtures generated from the
      # Python core. Runs inside the existing frontend job rather than as a new
      # one, so no ruleset change is needed and the required-check list is
      # unchanged.
      - name: Parity tests
        run: npm test

      - name: Build
        run: npm run build

      # Fails on anything at moderate or above, except advisories explicitly
      # allowlisted (with a reason and a review-by date) in the gate script.
      # npm audit cannot read osv-scanner.toml, so the deferral has to be
      # restated here; keep the two lists in step.
      - name: Audit dependencies
        run: npm audit --json --omit=dev | node scripts/npm-audit-gate.mjs

  # Remote MCP PoC checks (Cloudflare Workers + TypeScript)
  remote-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/remote-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: examples/remote-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  # ---------------------------------------------------------------------------
  # Red-main notification
  #
  # On 2026-08-10 the weekly scheduled run failed `frontend` and `osv-scan` on
  # main, with no commit behind it — advisory feeds moved under a static tree.
  # Nothing notified anyone. The next human contact was a session boot two days
  # later. On a repository that goes days between commits, the schedule's cadence
  # IS the detection interval, so a silent detection is barely a detection.
  #
  # These two jobs make the state of main visible in a place a person is already
  # notified about: an assigned issue. `notify-red-main` opens one (or comments
  # on the existing one) when any required job fails on the default branch;
  # `clear-red-main` closes it when the branch comes back green, so the issue's
  # presence always means "main is red right now" rather than "main was red once".
  #
  # Deliberately NOT on pull requests: a PR surfaces its own failures on the PR,
  # and an issue per red PR would be noise that trains people to ignore the label.
  #
  # NOTE: these two jobs are NOT required contexts, and must not become ones.
  # A notifier that can block a merge is a notifier that will be bypassed.
  # ---------------------------------------------------------------------------
  notify-red-main:
    needs: [gitleaks, opengrep, osv-scan, lint, typecheck, pytest, frontend, remote-mcp]
    if: ${{ failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the red-main issue
        env:
          # Every value is workflow metadata, never user-supplied content, and is
          # passed through the environment rather than interpolated into the
          # script — the standard guard against workflow command injection.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          FAILED=$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries
                     | map(select(.value.result != "success"))
                     | map(.key)
                     | join(", ")')
          [ -n "$FAILED" ] || FAILED="(none reported — check the run)"

          gh label create red-main --repo "$REPO" --color B60205 \
            --description "The default branch is failing a required check" \
            >/dev/null 2>&1 || true

          BODY=$(cat <<EOF
          A required check is failing on the default branch.

          | | |
          |---|---|
          | Failing jobs | $FAILED |
          | Commit | \`$SHA\` |
          | Trigger | \`$EVENT\` |
          | Run | $RUN_URL |

          This issue was opened automatically and is reused while it stays open.
          It closes itself when a run on the default branch goes green, so an open
          copy means **main is red right now**.
          EOF
          )

          EXISTING=$(gh issue list --repo "$REPO" --label red-main --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" \
              --title "main is red: a required check is failing" \
              --label red-main \
              --assignee "$OWNER" \
              --body "$BODY"
          fi

  clear-red-main:
    needs: [gitleaks, opengrep, osv-scan, lint, typecheck, pytest, frontend, remote-mcp]
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the red-main issue if one is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          EXISTING=$(gh issue list --repo "$REPO" --label red-main --state open \
            --json number --jq '.[0].number // empty')

          if [ -z "$EXISTING" ]; then
            echo "No open red-main issue; nothing to close."
            exit 0
          fi

          gh issue close "$EXISTING" --repo "$REPO" --comment \
            "All required checks passed on the default branch at \`$SHA\`. Closing. Run: $RUN_URL"
