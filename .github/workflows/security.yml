# GitHub Actions CI Workflow
# Runs on push to main, all PRs, and weekly Monday scan
#
# Jobs: gitleaks scan, opengrep SAST, osv-scanner SCA, ruff lint, pyright typecheck, frontend checks
#
# Third-party actions are pinned to a full commit SHA (human-readable version in
# a trailing comment) so a moved or hijacked tag can't swap an action out from
# under us. Dependabot (github-actions ecosystem) keeps the SHAs fresh.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret detection with gitleaks
  gitleaks:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Static analysis with Opengrep (replaces bandit)
  opengrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Installer pinned to a release tag (immutable) AND checksum-verified before
      # execution — downloaded to a file, SHA-256 checked, then run (no curl|bash
      # pipe), so a hijacked URL or tampered script can't execute in CI. Keep
      # OPENGREP_VERSION in step with the pinned version so CI == local. On bump,
      # regenerate the checksum:
      #   gh api repos/opengrep/opengrep/contents/install.sh?ref=<tag> --jq .content | base64 -d | sha256sum
      # The binary lands in ~/.opengrep/cli/latest, which is NOT on PATH, so we
      # add it to $GITHUB_PATH for the scan step. (Previously this was masked:
      # the scan step exited 127 "command not found" but `|| true` swallowed it,
      # so SAST never actually ran in CI.)
      - name: Install Opengrep
        env:
          OPENGREP_VERSION: v1.25.0
          OPENGREP_INSTALLER_SHA256: 765f8eba6df9349a172ce3103d2e8f21966d3826b6cb2d84b97442b0883a6d5b
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_VERSION}/install.sh" -o install-opengrep.sh
          echo "${OPENGREP_INSTALLER_SHA256}  install-opengrep.sh" | sha256sum -c -
          bash install-opengrep.sh
          rm -f install-opengrep.sh
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"

      # Blocking: --error makes opengrep exit non-zero on findings, and we no
      # longer swallow that with `|| true`. A real finding now fails CI.
      - name: Run Opengrep
        run: opengrep scan --config auto --config .opengrep/ --scan-unknown-extensions --error --json -o opengrep-report.json

      - name: Upload Opengrep Report
        if: always() # capture the report even when the scan step fails
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opengrep-report
          path: opengrep-report.json
          if-no-files-found: ignore

  # Dependency vulnerability scanning with osv-scanner
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            --config=osv-scanner.toml
            .

  # Code quality with ruff
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Installs the Python pinned in .python-version and caches by uv.lock hash
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

  # Type checking with pyright
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      # --frozen fails the job if uv.lock has drifted from pyproject.toml,
      # so the committed lock is exercised on every run, not just stored.
      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      - name: Run Pyright
        run: uv run pyright

  # Frontend checks (Astro + Svelte + TypeScript)
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate --omit=dev
