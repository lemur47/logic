# GitHub Actions CI Workflow
# Runs on push to main, all PRs, and weekly Monday scan
#
# Jobs: gitleaks scan, opengrep SAST, osv-scanner SCA, ruff lint, pyright typecheck, frontend checks
#
# Third-party actions are pinned to a full commit SHA (human-readable version in
# a trailing comment) so a moved or hijacked tag can't swap an action out from
# under us. Dependabot (github-actions ecosystem) keeps the SHAs fresh.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret detection with gitleaks
  gitleaks:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Static analysis with Opengrep (replaces bandit)
  opengrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Installer pinned to a release tag (not the mutable `main` branch) so the
      # bootstrap script is immutable; it installs the matching opengrep release.
      - name: Install Opengrep
        run: curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/v1.23.0/install.sh | bash

      # Blocking: --error makes opengrep exit non-zero on findings, and we no
      # longer swallow that with `|| true`. A real finding now fails CI.
      - name: Run Opengrep
        run: opengrep scan --config auto --config .opengrep/ --scan-unknown-extensions --error --json -o opengrep-report.json

      - name: Upload Opengrep Report
        if: always() # capture the report even when the scan step fails
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opengrep-report
          path: opengrep-report.json
          if-no-files-found: ignore

  # Dependency vulnerability scanning with osv-scanner
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@c5996e0193a3df57d695c1b8a1dec2a4c62e8730 # v2.3.3
        with:
          scan-args: |-
            --recursive
            --config=osv-scanner.toml
            .

  # Code quality with ruff
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Installs the Python pinned in .python-version and caches by uv.lock hash
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

  # Type checking with pyright
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      # --frozen fails the job if uv.lock has drifted from pyproject.toml,
      # so the committed lock is exercised on every run, not just stored.
      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev

      - name: Run Pyright
        run: uv run pyright

  # Frontend checks (Astro + Svelte + TypeScript)
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate --omit=dev
