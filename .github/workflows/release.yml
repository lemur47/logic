# Release workflow — publishes pmorun-mcp to PyPI on a version tag.
#
# Trigger: pushing a tag matching v* (e.g. v0.1.0).
# Auth: OIDC Trusted Publishing — no long-lived PyPI token / no secrets.
#       The publish job mints a short-lived OIDC token that PyPI exchanges for
#       upload rights, scoped to this repo + the `pypi` environment.
#
# Third-party actions are pinned to a full commit SHA (version in a trailing
# comment). The publish job below holds `id-token: write`, so pinning its
# action — gh-action-pypi-publish, previously the mutable `release/v1` branch
# ref — is the highest-value pin in the repo.
#
# One-time setup before the first release: see docs/RELEASING.md.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Build the sdist + wheel once, hand them to the publish job as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12" # the package support floor

      # PyPI versions are immutable — fail fast if the tag and the packaged
      # version disagree, before anything is built or uploaded.
      - name: Guard — tag must match pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match pyproject version 'v$VERSION'"
            exit 1
          fi
          echo "Tag '$TAG' matches pyproject version 'v$VERSION'."

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate metadata and README rendering
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The GitHub environment the PyPI trusted publisher is scoped to.
    environment: pypi
    permissions:
      id-token: write # required for OIDC; this is the only elevated scope
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
