# Release workflow — publishes pmorun-mcp to PyPI on a version tag.
#
# Trigger: pushing a tag matching v* (e.g. v0.1.0).
# Auth: OIDC Trusted Publishing — no long-lived PyPI token / no secrets.
#       The publish job mints a short-lived OIDC token that PyPI exchanges for
#       upload rights, scoped to this repo + the `pypi` environment.
#
# One-time setup before the first release: see docs/RELEASING.md.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Build the sdist + wheel once, hand them to the publish job as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12" # the package support floor

      # PyPI versions are immutable — fail fast if the tag and the packaged
      # version disagree, before anything is built or uploaded.
      - name: Guard — tag must match pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match pyproject version 'v$VERSION'"
            exit 1
          fi
          echo "Tag '$TAG' matches pyproject version 'v$VERSION'."

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate metadata and README rendering
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The GitHub environment the PyPI trusted publisher is scoped to.
    environment: pypi
    permissions:
      id-token: write # required for OIDC; this is the only elevated scope
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
