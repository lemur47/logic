# Release workflow — publishes pmorun-mcp to PyPI on a version tag.
#
# Triggers:
#   - pushing a tag matching v* (e.g. v0.1.0) → the real publish to PyPI.
#   - workflow_dispatch → a REHEARSAL. It can never reach production PyPI: the
#     only offered targets are "none" and "testpypi", so the safety is structural
#     rather than a convention someone has to remember.
#
# Auth: OIDC Trusted Publishing — no long-lived PyPI token / no secrets.
#       The publish job mints a short-lived OIDC token that PyPI exchanges for
#       upload rights, scoped to this repo + the `pypi` environment.
#
# Third-party actions are pinned to a full commit SHA (version in a trailing
# comment). The publish job below holds `id-token: write`, so pinning its
# action — gh-action-pypi-publish, previously the mutable `release/v1` branch
# ref — is the highest-value pin in the repo.
#
# Why a rehearsal trigger exists at all: this workflow's only consumer was a tag
# push, so no pull request has ever exercised it and every change to it went live
# unverified at the one moment it mattered. Dispatching it with target "none"
# exercises checkout, setup-python, the build, and the artifact round-trip without
# uploading anything anywhere.
#
# One-time setup before the first release, and before the first testpypi
# rehearsal: see docs/RELEASING.md.

name: Release

on:
  push:
    tags:
      - "v*"
  pull_request: # POSITIVE CONTROL SCAFFOLDING — removed before merge.
  workflow_dispatch:
    inputs:
      target:
        description: "Rehearsal target. Production PyPI is deliberately not offered here — only a tag push publishes for real."
        type: choice
        options:
          - none
          - testpypi
        default: none

permissions:
  contents: read

jobs:
  # Build the sdist + wheel once, hand them to the publish job as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # the package support floor

      # PyPI versions are immutable — fail fast if the tag and the packaged
      # version disagree, before anything is built or uploaded. Skipped on a
      # rehearsal, where there is no version tag to check against.
      - name: Guard — tag must match pyproject version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match pyproject version 'v$VERSION'"
            exit 1
          fi
          echo "Tag '$TAG' matches pyproject version 'v$VERSION'."

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate metadata and README rendering
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  # Install the built wheel the way a USER gets it — no lockfile in the picture —
  # and make the server answer a real MCP handshake. This is the control whose
  # absence let 0.1.1 ship unusable: its `mcp` requirement had no upper bound, and
  # `uv.lock` hid that from every other gate. Resolving fresh here is the whole
  # point; do not "fix" a red in this job by installing from the lockfile.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    # The handshake bounds its own waits, but a wedged install step would otherwise
    # sit on the runner's 6-hour default before telling anyone.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # the package support floor

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install the wheel with dependencies resolved fresh from PyPI
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install --quiet --upgrade pip
          .smoke/bin/python -m pip install --quiet dist/*.whl

      # PMORUN_DB is deliberately unset, so this asserts the DEFAULT surface.
      # If a release intentionally changes that count, change it here too — this
      # is the assertion the published docs are checked against.
      - name: Make the server answer
        run: python scripts/mcp_smoke.py --expect-tools 4 -- .smoke/bin/pmorun-mcp

  # A tag push must not be the first time this release path is exercised. The
  # checklist has always ASKED for a green TestPyPI rehearsal before tagging;
  # nothing enforced it, so the `pypi` environment's required reviewer was the
  # only thing standing between an unrehearsed change and production — a human
  # substituting for a control.
  #
  # What counts as evidence: a workflow_dispatch run of THIS workflow, on THIS
  # exact commit, whose `publish` job succeeded. On a dispatch, `publish` runs
  # only when target is `testpypi`, so a successful publish job proves the target
  # without reading the inputs — which the runs API does not expose.
  #
  # This deliberately does NOT put TestPyPI in the production release path. The
  # first rehearsal on 2026-08-17 failed on a 5-second OIDC read timeout to
  # test.pypi.org and passed on re-run; publishing to TestPyPI during a real
  # release would have made that transient block the release itself. Evidence of
  # an earlier rehearsal costs one API read and depends on nobody's uptime.
  #
  # There is no bypass, and none is needed: the remedy for a blocked tag is to
  # dispatch the rehearsal on that commit, which takes about two minutes.
  rehearsed:
    # POSITIVE CONTROL SCAFFOLDING — removed before merge.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read # read this workflow's own run history; nothing else
    steps:
      - name: Require a green TestPyPI rehearsal for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$(gh api \
            "/repos/${REPO}/actions/workflows/release.yml/runs?event=workflow_dispatch&head_sha=${SHA}&status=success&per_page=20" \
            --jq '.workflow_runs[].id')"
          for id in ${runs}; do
            if gh api "/repos/${REPO}/actions/runs/${id}/jobs" \
              --jq '.jobs[] | select(.name == "publish") | .conclusion' | grep -qx success; then
              echo "Rehearsal found: run ${id} published ${SHA} to TestPyPI."
              exit 0
            fi
          done
          echo "::error::No green TestPyPI rehearsal for ${SHA}. Dispatch Release with target=testpypi on this commit, let it pass, then re-run this tag."
          exit 1

  publish:
    needs: [build, smoke, rehearsed]
    # A tag push publishes for real, and only once `rehearsed` has confirmed this
    # commit was rehearsed. A rehearsal only publishes if it explicitly asked for
    # TestPyPI; with target "none" the run stops after the smoke test.
    #
    # `!cancelled()` is load-bearing: on a rehearsal `rehearsed` is SKIPPED, and a
    # job whose dependency skipped is skipped too unless its condition survives
    # that state. Without it this workflow would silently stop publishing to
    # TestPyPI — the rehearsal would go green having done nothing.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.smoke.result == 'success'
      && (
        (github.event_name == 'push' && needs.rehearsed.result == 'success')
        || inputs.target == 'testpypi'
      )
    runs-on: ubuntu-latest
    # The GitHub environment the matching trusted publisher is scoped to. On a
    # rehearsal this is `testpypi`, which cannot publish to production PyPI even
    # if the repository-url below were wrong.
    environment: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write # required for OIDC; this is the only elevated scope
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # TestPyPI versions are immutable too, so without this a second rehearsal
          # of the same version fails with "file already exists" — and the release
          # checklist asks for a green rehearsal before every tag, which would then
          # be unsatisfiable after the first attempt. Scoped to rehearsals on
          # purpose: on a real publish a version collision is a genuine mistake
          # (usually a re-tag) and must fail loudly rather than be skipped.
          skip-existing: ${{ github.event_name != 'push' }}
