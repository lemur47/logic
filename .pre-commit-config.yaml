# Pre-commit hooks for logic repo
# Security-first with minimal friction
#
# Install: uv pip install pre-commit && pre-commit install
# Update: pre-commit autoupdate
#
# Two stages are wired, so `pre-commit install` alone is enough — without
# default_install_hook_types the commit-msg guard installs silently as a no-op.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Security - Gitleaks (secret scanning, staged content)
  #
  # DO NOT ADD `args` HERE. pre-commit APPENDS args to the hook's own entry, it
  # does not replace it. The upstream entry is already complete:
  #
  #     gitleaks git --pre-commit --redact --staged --verbose
  #
  # so an added `args: ["dir", ...]` produced `... --verbose dir --config=...`,
  # where gitleaks read `dir` as the PATH to scan. It failed to chdir, scanned
  # 0 commits, and EXITED 0 — the hook reported "Passed" on every commit for as
  # long as it was configured that way, and `--config` never applied either, so
  # the airtable-id rule was not even loaded. A commit carrying a planted canary
  # went through green, with hooks enabled and no --no-verify (2026-08-13).
  #
  # The config is auto-discovered: gitleaks finds .gitleaks.toml at the repo
  # root without being told. If you ever do need to pass something, verify the
  # RESOLVED argv (`pre-commit run gitleaks --verbose`) and re-run the positive
  # control — this defect existed precisely because the config looked correct.
  #
  # Keep `rev` in step with GITLEAKS_VERSION in .github/workflows/security.yml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Security - Opengrep (SAST with data-flow analysis)
  # Replaces bandit — covers Python, JS/TS, Svelte, YAML, Dockerfile
  - repo: local
    hooks:
      - id: opengrep
        name: opengrep
        entry: opengrep scan --config auto --config .opengrep/ --scan-unknown-extensions --error --quiet
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Security - osv-scanner (dependency vulnerability scanning)
  - repo: https://github.com/google/osv-scanner
    rev: v2.3.3
    hooks:
      - id: osv-scanner
        args:
          - "scan"
          - "source"
          - "--config=osv-scanner.toml"
          - "--format=vertical"
          - "--verbosity=error"
          - "--recursive"
          - "."

  # Security - Airtable ID guard (commit MESSAGE surface)
  #
  # gitleaks above scans staged file content; it cannot see the commit message,
  # which is never a file in the working tree. This closes that surface, and
  # being tracked here it also covers commits made outside the agent
  # environment. The companion PreToolUse hook (same script, --hook) covers
  # `gh pr`/`gh issue` bodies but lives in gitignored settings, so it does not
  # travel with a clone.
  - repo: local
    hooks:
      - id: airtable-id-guard
        name: Airtable ID guard (commit message)
        entry: python scripts/check-airtable-ids.py
        language: system
        stages: [commit-msg]

  # Code Quality - Ruff (linting + formatting)
  # Keep this rev in step with the ruff floor in pyproject.toml and the version
  # uv.lock resolves for CI. These three had drifted to v0.15.5 / >=0.15.0 /
  # 0.15.22, so local commits and CI were running different formatters — the
  # divergence is invisible until the two versions disagree about a file.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Type checking - Pyright (app/ only)
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Tests - pytest
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Type checking - Astro (site/ only)
  - repo: local
    hooks:
      - id: astro-check
        name: astro check
        entry: bash -c 'cd site && npx astro check'
        language: system
        pass_filenames: false
        files: ^site/

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
