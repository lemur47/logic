# Pre-commit hooks for logic repo
# Security-first with minimal friction
#
# Install: uv pip install pre-commit && pre-commit install
# Update: pre-commit autoupdate

repos:
  # Security - Gitleaks (v8.30.0+ uses 'gitleaks dir' command)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args: ["dir", "--config=.gitleaks.toml", "--verbose"]

  # Security - Bandit (Python security linter)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.2
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "."]
        additional_dependencies: ["bandit[toml]"]

  # Code Quality - Ruff (linting + formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Type checking - Pyright (app/ only)
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Tests - pytest
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Type checking - Astro (site/ only)
  - repo: local
    hooks:
      - id: astro-check
        name: astro check
        entry: bash -c 'cd site && npx astro check'
        language: system
        pass_filenames: false
        files: ^site/

  # Security check - npm (ommiting dev)
  - repo: local
    hooks:
      - id: npm-audit
        name: npm audit
        entry: bash -c 'cd site && npm audit --audit-level=moderate --omit=dev'
        language: system
        pass_filenames: false
        files: ^site/

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
